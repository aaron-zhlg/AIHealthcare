[project]
name = "aihealthcare"
version = "0.1.0"
description = "AIHealthcare — ABIDE brain connectivity and ASD classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aihealthcare", "autoresearch"]

[project.scripts]
train-gcn = "aihealthcare.train:main"
eval-gcn = "aihealthcare.eval:main"
loso-cv-gcn = "aihealthcare.loso_cv:main"
