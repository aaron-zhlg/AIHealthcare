[project]
name = "aihealthcare"
version = "0.1.0"
description = "AIHealthcare — ABIDE brain connectivity and ASD classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    # Multi-agent framework powering aihealthcare.agents (orchestrator + subagents).
    "orchestra-agents",
]

# orchestra lives as a sibling repo; consume it as a local path dependency.
# Swap this for a git/PyPI source once orchestra is published, e.g.
#   orchestra-agents = { git = "https://github.com/aaron-zhlg/orchestra" }
[tool.uv.sources]
orchestra-agents = { path = "../orchestra" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aihealthcare", "autoresearch"]

[project.scripts]
train-gcn = "aihealthcare.train:main"
eval-gcn = "aihealthcare.eval:main"
loso-cv-gcn = "aihealthcare.loso_cv:main"
explain-gcn = "aihealthcare.explain:main"
# Multi-agent medical research system
med-research = "aihealthcare.agents.orchestrator:main"
med-litsearch = "aihealthcare.agents.literature:main"
med-trials = "aihealthcare.agents.trials:main"
